let atual = 0;

function renderGrade() {
  const grade = document.getElementById('grade');
  grade.innerHTML = temas.map((t, i) => `
    <button class="card" data-i="${i}">
      <span class="num">${String(i + 1).padStart(2, '0')}</span>
      <h3>${t.titulo}</h3>
      <p>${t.resumo}</p>
    </button>
  `).join('');
  grade.querySelectorAll('.card').forEach(c => {
    c.addEventListener('click', () => abrir(Number(c.dataset.i)));
  });
}

function abrir(i) {
  atual = i;
  const t = temas[i];
  document.getElementById('conteudo').innerHTML = `
    <div class="titulo-secao">
      <h2>${String(i + 1).padStart(2, '0')}. ${t.titulo}</h2>
      <p>${t.resumo}</p>
    </div>
    ${t.html}
  `;
  document.getElementById('btn-anterior').disabled = i === 0;
  document.getElementById('btn-proximo').disabled = i === temas.length - 1;
  document.getElementById('grade-view').style.display = 'none';
  document.getElementById('capa').style.display = 'none';
  document.getElementById('detalhe').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function voltar() {
  document.getElementById('detalhe').style.display = 'none';
  document.getElementById('grade-view').style.display = 'block';
  document.getElementById('capa').style.display = 'flex';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('btn-voltar').addEventListener('click', voltar);
document.getElementById('btn-anterior').addEventListener('click', () => { if (atual > 0) abrir(atual - 1); });
document.getElementById('btn-proximo').addEventListener('click', () => { if (atual < temas.length - 1) abrir(atual + 1); });

renderGrade();
</script>
